<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Radio Antidroga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <button onclick="togglePlay()">Play / Pause</button>

<audio id="mySong">
  <source src="https://www.dropbox.com/scl/fi/ty1i7j39th9fo5oq0kwg3/11-Various-Artists-Traveling-Echoes-Looking-For-A-Better-Place-To-Live.mp3?rlkey=z804f6lxloosy87a8k0bo4fe8&st=pxt9uopw&dl=1" type="audio/mp3">
</audio>

<script>
  var song = document.getElementById("mySong");
  function togglePlay() {
    if (song.paused) {
      song.play();
    } else {
      song.pause();
    }
  }
</script>
  
</body>
</html>
