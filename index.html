<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Radio Antidroga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
</head>

<body>
  <button onclick="togglePlay()">Play / Pause</button>

<audio id="mySong">
  <source src="https://www.dropbox.com/scl/fi/wkpll9m3mxyd5dh995o35/canyonero-con-latigo.wav?rlkey=dqhbmgzmge2vlcftmkdcttkoi&st=6lf1osan&dl=0" type="audio/wav">
</audio>

<script>
  var song = document.getElementById("mySong");
  function togglePlay() {
    if (song.paused) {
      song.play();
    } else {
      song.pause();
    }
  }
</script>
</body>
</html>
